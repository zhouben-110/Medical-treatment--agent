<h2>系统架构设计</h2>
<p class="subtitle">基于LangGraph状态机的医疗Agent</p>

<div class="section">
  <h3>整体架构</h3>
  <div class="mockup">
    <div class="mockup-header">系统架构图</div>
    <div class="mockup-body">
      <div style="display:flex;flex-direction:column;gap:16px;">
        <!-- 前端层 -->
        <div style="background:#e3f2fd;padding:12px;border-radius:8px;">
          <strong>前端层 (Next.js)</strong>
          <div style="display:flex;gap:12px;margin-top:8px;">
            <div class="placeholder">聊天界面</div>
            <div class="placeholder">历史记录</div>
            <div class="placeholder">症状分类</div>
          </div>
        </div>
        <!-- API层 -->
        <div style="text-align:center;">↕ WebSocket / REST API</div>
        <div style="background:#e8f5e9;padding:12px;border-radius:8px;">
          <strong>API层 (FastAPI)</strong>
          <div style="display:flex;gap:12px;margin-top:8px;">
            <div class="placeholder">/chat</div>
            <div class="placeholder">/history</div>
            <div class="placeholder">/symptoms</div>
          </div>
        </div>
        <!-- 核心层 -->
        <div style="text-align:center;">↕</div>
        <div style="background:#fff3e0;padding:12px;border-radius:8px;">
          <strong>核心层 (LangGraph)</strong>
          <div style="display:flex;gap:12px;margin-top:8px;flex-wrap:wrap;">
            <div class="placeholder">症状分析</div>
            <div class="placeholder">追问决策</div>
            <div class="placeholder">诊断生成</div>
            <div class="placeholder">建议输出</div>
          </div>
        </div>
        <!-- 数据层 -->
        <div style="text-align:center;">↕</div>
        <div style="background:#f3e5f5;padding:12px;border-radius:8px;">
          <strong>数据层</strong>
          <div style="display:flex;gap:12px;margin-top:8px;">
            <div class="placeholder">SQLite/PostgreSQL</div>
            <div class="placeholder">对话历史</div>
            <div class="placeholder">用户数据</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="section">
  <h3>这个架构看起来如何？</h3>
  <div class="options">
    <div class="option" data-choice="approve" onclick="toggleSelect(this)">
      <div class="letter">✓</div>
      <div class="content">
        <h3>看起来不错</h3>
        <p>继续下一个设计部分</p>
      </div>
    </div>
    <div class="option" data-choice="revise" onclick="toggleSelect(this)">
      <div class="letter">✎</div>
      <div class="content">
        <h3>需要调整</h3>
        <p>我有修改建议</p>
      </div>
    </div>
  </div>
</div>
