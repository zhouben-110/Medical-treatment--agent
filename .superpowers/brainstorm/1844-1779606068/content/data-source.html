<h2>数据源确认</h2>
<p class="subtitle">混合模式 — LLM + RAG结合，平衡成本与准确性</p>

<div class="section">
  <h3>RAG数据源选择</h3>
  <p>医学知识库的数据来源？</p>
  <div class="options">
    <div class="option" data-choice="a" onclick="toggleSelect(this)">
      <div class="letter">A</div>
      <div class="content">
        <h3>公开医学数据集</h3>
        <p>如PubMed、医学百科、公开病例，免费但需要清洗</p>
      </div>
    </div>
    <div class="option" data-choice="b" onclick="toggleSelect(this)">
      <div class="letter">B</div>
      <div class="content">
        <h3>专业医疗API</h3>
        <p>如UpToDate、BMJ Best Practice，权威但有成本</p>
      </div>
    </div>
    <div class="option" data-choice="c" onclick="toggleSelect(this)">
      <div class="letter">C</div>
      <div class="content">
        <h3>自建知识库</h3>
        <p>手动整理常见疾病治疗指南，可控但工作量大</p>
      </div>
    </div>
    <div class="option" data-choice="d" onclick="toggleSelect(this)">
      <div class="letter">D</div>
      <div class="content">
        <h3>MVP阶段先用LLM</h3>
        <p>先跑通流程，后续再接入专业数据</p>
      </div>
    </div>
  </div>
</div>
