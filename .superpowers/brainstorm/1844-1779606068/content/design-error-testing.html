<h2>错误处理与测试策略</h2>
<p class="subtitle">确保系统稳定可靠</p>

<div class="section">
  <h3>错误处理</h3>
  <div class="mockup">
    <div class="mockup-header">异常场景处理</div>
    <div class="mockup-body">
      <div style="display:flex;flex-direction:column;gap:12px;">
        <div style="background:#ffebee;padding:12px;border-radius:8px;">
          <strong>LLM调用失败</strong>
          <p style="margin:4px 0 0 0;font-size:14px;">降级为预设回复，提示用户稍后重试</p>
        </div>
        <div style="background:#ffebee;padding:12px;border-radius:8px;">
          <strong>症状无法识别</strong>
          <p style="margin:4px 0 0 0;font-size:14px;">引导用户重新描述，或建议就医</p>
        </div>
        <div style="background:#ffebee;padding:12px;border-radius:8px;">
          <strong>数据库连接失败</strong>
          <p style="margin:4px 0 0 0;font-size:14px;">内存缓存兜底，异步重试写入</p>
        </div>
        <div style="background:#fff8e1;padding:12px;border-radius:8px;">
          <strong>免责声明</strong>
          <p style="margin:4px 0 0 0;font-size:14px;">每次回复末尾附带"仅供参考，不构成医疗建议"</p>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="section">
  <h3>测试策略</h3>
  <div class="mockup">
    <div class="mockup-header">测试覆盖</div>
    <div class="mockup-body">
      <div style="display:flex;flex-direction:column;gap:12px;">
        <div style="background:#e8f5e9;padding:12px;border-radius:8px;">
          <strong>单元测试</strong>
          <p style="margin:4px 0 0 0;font-size:14px;">各节点逻辑独立测试</p>
        </div>
        <div style="background:#e8f5e9;padding:12px;border-radius:8px;">
          <strong>集成测试</strong>
          <p style="margin:4px 0 0 0;font-size:14px;">完整对话流程测试</p>
        </div>
        <div style="background:#e8f5e9;padding:12px;border-radius:8px;">
          <strong>API测试</strong>
          <p style="margin:4px 0 0 0;font-size:14px;">接口请求响应验证</p>
        </div>
        <div style="background:#e3f2fd;padding:12px;border-radius:8px;">
          <strong>E2E测试</strong>
          <p style="margin:4px 0 0 0;font-size:14px;">前端到后端完整流程</p>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="section">
  <h3>错误处理和测试策略如何？</h3>
  <div class="options">
    <div class="option" data-choice="approve" onclick="toggleSelect(this)">
      <div class="letter">✓</div>
      <div class="content">
        <h3>没问题</h3>
        <p>设计完成，准备写文档</p>
      </div>
    </div>
    <div class="option" data-choice="revise" onclick="toggleSelect(this)">
      <div class="letter">✎</div>
      <div class="content">
        <h3>需要调整</h3>
        <p>我有修改建议</p>
      </div>
    </div>
  </div>
</div>
