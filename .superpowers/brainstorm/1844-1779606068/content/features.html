<h2>功能范围确认</h2>
<p class="subtitle">MVP核心功能：多轮对话 + 历史记录 + 症状分类</p>

<div class="section">
  <h3>已选功能</h3>
  <div class="cards">
    <div class="card">
      <div class="card-body">
        <h3>多轮对话</h3>
        <p>AI追问症状细节，提高诊断准确性</p>
      </div>
    </div>
    <div class="card">
      <div class="card-body">
        <h3>历史记录</h3>
        <p>保存咨询历史，方便回溯</p>
      </div>
    </div>
    <div class="card">
      <div class="card-body">
        <h3>症状分类</h3>
        <p>按科室/部位组织症状，提升用户体验</p>
      </div>
    </div>
  </div>
</div>

<div class="section">
  <h3>界面风格</h3>
  <p>前端交互风格偏好？</p>
  <div class="options">
    <div class="option" data-choice="a" onclick="toggleSelect(this)">
      <div class="letter">A</div>
      <div class="content">
        <h3>纯聊天界面</h3>
        <p>类似ChatGPT，简洁直接</p>
      </div>
    </div>
    <div class="option" data-choice="b" onclick="toggleSelect(this)">
      <div class="letter">B</div>
      <div class="content">
        <h3>表单+聊天混合</h3>
        <p>先选症状分类，再进入对话</p>
      </div>
    </div>
    <div class="option" data-choice="c" onclick="toggleSelect(this)">
      <div class="letter">C</div>
      <div class="content">
        <h3>引导式问答</h3>
        <p>步骤式引导，像填问卷</p>
      </div>
    </div>
  </div>
</div>
