<h2>前端界面设计</h2>
<p class="subtitle">Next.js聊天界面布局</p>

<div class="section">
  <h3>页面布局</h3>
  <div class="mockup">
    <div class="mockup-header">主界面布局</div>
    <div class="mockup-body">
      <div style="display:flex;gap:16px;height:400px;">
        <!-- 侧边栏 -->
        <div style="width:200px;background:#f5f5f5;padding:12px;border-radius:8px;display:flex;flex-direction:column;">
          <div style="background:#1976d2;color:white;padding:8px;border-radius:4px;text-align:center;margin-bottom:12px;">
            + 新对话
          </div>
          <div style="font-size:12px;color:#666;margin-bottom:8px;">历史记录</div>
          <div style="flex:1;overflow:hidden;">
            <div style="background:white;padding:8px;border-radius:4px;margin-bottom:4px;font-size:13px;">头痛发烧咨询</div>
            <div style="background:white;padding:8px;border-radius:4px;margin-bottom:4px;font-size:13px;">皮肤过敏问题</div>
            <div style="background:white;padding:8px;border-radius:4px;font-size:13px;">胃痛分析</div>
          </div>
        </div>
        <!-- 主聊天区 -->
        <div style="flex:1;display:flex;flex-direction:column;background:white;border:1px solid #e0e0e0;border-radius:8px;">
          <!-- 消息区 -->
          <div style="flex:1;padding:16px;overflow:hidden;">
            <div style="display:flex;gap:8px;margin-bottom:12px;">
              <div style="background:#e3f2fd;padding:8px 12px;border-radius:12px;max-width:70%;font-size:14px;">
                你好！请描述你的症状，我会尽力帮你分析。
              </div>
            </div>
            <div style="display:flex;gap:8px;margin-bottom:12px;justify-content:flex-end;">
              <div style="background:#1976d2;color:white;padding:8px 12px;border-radius:12px;max-width:70%;font-size:14px;">
                我最近总是头痛，还有点发烧
              </div>
            </div>
            <div style="display:flex;gap:8px;margin-bottom:12px;">
              <div style="background:#e3f2fd;padding:8px 12px;border-radius:12px;max-width:70%;font-size:14px;">
                了解了。请问：<br>1. 头痛持续多久了？<br>2. 体温大概多少度？<br>3. 还有其他症状吗？
              </div>
            </div>
          </div>
          <!-- 输入区 -->
          <div style="padding:12px;border-top:1px solid #e0e0e0;display:flex;gap:8px;">
            <div style="flex:1;background:#f5f5f5;padding:10px;border-radius:8px;color:#999;">描述你的症状...</div>
            <div style="background:#1976d2;color:white;padding:10px 16px;border-radius:8px;">发送</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="section">
  <h3>关键交互</h3>
  <div class="cards">
    <div class="card">
      <div class="card-body">
        <h3>流式输出</h3>
        <p>AI回复逐字显示，提升体验</p>
      </div>
    </div>
    <div class="card">
      <div class="card-body">
        <h3>症状高亮</h3>
        <p>识别出的症状用标签高亮显示</p>
      </div>
    </div>
    <div class="card">
      <div class="card-body">
        <h3>加载状态</h3>
        <p>分析中显示loading动画</p>
      </div>
    </div>
  </div>
</div>

<div class="section">
  <h3>前端设计如何？</h3>
  <div class="options">
    <div class="option" data-choice="approve" onclick="toggleSelect(this)">
      <div class="letter">✓</div>
      <div class="content">
        <h3>没问题</h3>
        <p>继续下一个部分</p>
      </div>
    </div>
    <div class="option" data-choice="revise" onclick="toggleSelect(this)">
      <div class="letter">✎</div>
      <div class="content">
        <h3>需要调整</h3>
        <p>我有修改建议</p>
      </div>
    </div>
  </div>
</div>
